name: 重生成历史卡片

on:
  schedule:
    # 每周一 UTC 03:00 用真实赛果重新生成“历史上的今天”
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 下载真实赛果并生成卡片
        run: node tools/generate.js

      - name: 提交更新
        run: |
          git config user.name "tennis-cards-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated.js
          git diff --cached --quiet || (git commit -m "chore: 重生成历史卡片" && git push)